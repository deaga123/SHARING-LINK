<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sharing Link</title>
    <style>
      body {
        font-family: sans-serif;
        background: #f0f0ed;
        padding: 40px;
      }
      .container {
        display: flex;
        gap: 20px;
        flex-wrap: wrap;
      }
      .card {
        background: #fbfbfa;
        border-radius: 12px;
        padding: 20px;
        width: 220px;
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
      }
      .btn {
        display: inline-block;
        padding: 8px 16px;
        background: #fff;
        border: 1px solid #ccc;
        border-radius: 20px;
        cursor: pointer;
        text-decoration: none;
        color: #000;
        margin-top: 10px;
      }
    </style>
  </head>
  <body>
    <h1>Sharing Link</h1>
    <p>Setiap link di bawah ini dilindungi password.</p>

    <div class="container">
      <!-- Card 1 -->
      <div class="card">
        <h3>Tugas Tugas 🔒</h3>
        <p>Kumpulan Tugas-Tugas</p>
        <button class="btn" onclick="openLink('12345', 'https://drive.google.com')">Buka Link ↗</button>
      </div>

      <!-- Card 2 -->
      <div class="card">
        <h3>Materi 🔒</h3>
        <p>Semua Materi Kelas B3</p>
        <button class="btn" onclick="openLink('materi2026', 'https://drive.google.com/drive/folders/18TtGwySHAPnZvQR-5ZrRpgGLn5PaNkgi?usp=sharing')">Buka Link ↗</button>
      </div>
    </div>

    <script>
      function openLink(passBenar, urlTujuan) {
        let inputPass = prompt("Masukkan password untuk membuka link ini:");
        if (inputPass === passBenar) {
          window.open(urlTujuan, "_blank");
        } else if (inputPass !== null) {
          alert("Password salah!");
        }
      }
    </script>
  </body>
</html>
